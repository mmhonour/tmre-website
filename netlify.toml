[build]
  # Rebuild native bindings for listing-photos SQLite, then build.
  # MLS inventory persists in Neon Postgres across deploys.
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "22"
  SKIP_LISTINGS_SYNC = "true"
  LISTINGS_DB_PATH = "/tmp/listings.db"
  # Prevent npm install / rebuild from compiling native addons on Noble (glibc 2.38).
  NPM_CONFIG_BUILD_FROM_SOURCE = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Fails the deploy if the sync function bundle cannot be imported (see plugin).
[[plugins]]
  package = "/netlify/plugins/verify-sync-functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["rets-client", "node-expat", "better-sqlite3", "bindings", "@netlify/blobs"]
  included_files = [
    "node_modules/rets-client/**",
    "node_modules/node-expat/**",
    "node_modules/better-sqlite3/**",
    "node_modules/bindings/**",
  ]

# Cron pattern (Netlify): schedule XOR background — never both on one function.
# Thin scheduled triggers (≤30s) queue *-worker background functions (≤15m).
# Putting schedule+background together is a silent no-op.

[functions."sync-listings"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-listings-worker"]
  included_files = []
  background = true

# Heals when heartbeat is fresh but last_incremental_sync is stale (dead worker / hung hop).
[functions."sync-listings-watchdog"]
  included_files = []
  schedule = "*/15 * * * *"

# Dense every-30m wake — Configure Frequency/Start time gate inside the handler.
[functions."sync-listings-full"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-listings-full-worker"]
  included_files = []
  background = true

[functions."sync-property-addresses"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-property-addresses-worker"]
  included_files = []
  background = true

[functions."sync-listing-edge-scores"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-listing-edge-scores-worker"]
  included_files = []
  background = true

[functions."sync-zip-boundaries"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-zip-boundaries-worker"]
  included_files = []
  background = true

[functions."market-digest"]
  included_files = []
  schedule = "0 12 * * 1"

[functions."market-digest-worker"]
  included_files = []
  background = true

# FOMC decision day ~3:15pm ET — dense cron; handler gates on calendar + start time.
[functions."sync-fomc"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-fomc-worker"]
  included_files = []
  background = true

# CPI release day ~9:15am ET — dense cron; handler gates on calendar + start time.
[functions."sync-cpi"]
  included_files = []
  schedule = "*/30 * * * *"

[functions."sync-cpi-worker"]
  included_files = []
  background = true
