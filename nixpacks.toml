# Railway mls-sync: Node 20 + toolchain for node-gyp (node-expat / better-sqlite3).
#
# Avoid `npm ci` here: it deletes node_modules and hits EBUSY on Railway’s
# mounted /app/node_modules/.cache. Use npm install + cache under /tmp instead.
# Also clear any custom Build Command = `npm ci` in the Railway service UI.

[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_CACHE = "/tmp/npm-cache"

[phases.setup]
nixPkgs = ["...", "python311", "gcc"]
aptPkgs = ["build-essential", "libexpat1-dev"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

# No Next.js build — this service only runs services/mls-sync/server.ts.
[phases.build]
cmds = ["echo mls-sync: skip app build"]
